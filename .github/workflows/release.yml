name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v ./...

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          LDFLAGS="-X main.version=${VERSION}"

          mkdir -p dist

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/azurestrike-linux-amd64 ./cmd/azurestrike

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/azurestrike-linux-arm64 ./cmd/azurestrike

          # Darwin amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/azurestrike-darwin-amd64 ./cmd/azurestrike

          # Darwin arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/azurestrike-darwin-arm64 ./cmd/azurestrike

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/azurestrike-windows-amd64.exe ./cmd/azurestrike

          # Windows arm64
          GOOS=windows GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/azurestrike-windows-arm64.exe ./cmd/azurestrike

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/azurestrike-linux-amd64
            dist/azurestrike-linux-arm64
            dist/azurestrike-darwin-amd64
            dist/azurestrike-darwin-arm64
            dist/azurestrike-windows-amd64.exe
            dist/azurestrike-windows-arm64.exe
            dist/checksums.txt
          generate_release_notes: true
